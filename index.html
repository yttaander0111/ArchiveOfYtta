<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鱼的作品集归档 | ArchiveOfYtta</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f6fb; color: #1a1a2e; line-height:1.6; padding:20px;
}
.container { max-width:900px; margin:0 auto; min-height:calc(100vh - 80px); }
header { text-align:center; margin-bottom:32px; padding:24px 0; }
header h1 { font-size:32px; font-weight:500; color:#1e3a5f; margin-bottom:6px; letter-spacing:3px; }
header p { font-size:14px; color:#7a9ab8; font-variant-numeric:tabular-nums; letter-spacing:1px; }

.view { display:none; }
.view.active { display:block; }

.category { margin-bottom:8px; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(30,58,95,0.06); }
.cat-header { display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; user-select:none; transition:background 0.15s ease; }
.cat-header:hover { background:#e8f1f8; }
.cat-arrow { font-size:12px; color:#5a8ab8; transition:transform 0.2s ease; display:inline-block; }
.cat-arrow.open { transform:rotate(90deg); }
.cat-name { font-size:16px; font-weight:500; color:#1e3a5f; }
.sub-list { padding:0 18px 12px 44px; }
.sub-item { margin-bottom:4px; }
.sub-header { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:8px; transition:background 0.15s ease; }
.sub-header:hover { background:#f5f9fd; }
.sub-left { display:flex; align-items:center; gap:8px; flex:1; cursor:pointer; }
.sub-arrow { font-size:11px; color:#7a9ab8; transition:transform 0.2s ease; display:inline-block; width:14px; text-align:center; }
.sub-arrow.open { transform:rotate(90deg); }
.sub-name { font-size:14px; color:#4a6a8a; display:flex; align-items:center; gap:8px; }
.sub-actions { display:flex; align-items:center; gap:4px; }
.btn-icon {
  background:none; border:none; cursor:pointer; padding:4px; border-radius:6px;
  color:#a0b8d0; transition:all 0.15s ease; display:flex; align-items:center; justify-content:center;
}
.btn-icon:hover { color:#1e3a5f; background:#e0ecf6; }
.btn-enter {
  font-size:12px; color:#5a9bd5; padding:3px 10px; border:1px solid #c8ddf0; border-radius:6px;
  background:#f5f9fd; cursor:pointer; transition:all 0.15s ease;
}
.btn-enter:hover { background:#e0ecf6; border-color:#5a9bd5; }

.tree-works { padding-left:28px; }
.tree-work { display:flex; align-items:center; justify-content:space-between; padding:5px 10px; border-radius:6px; cursor:pointer; transition:background 0.15s ease; }
.tree-work:hover { background:#eef4fa; }
.tree-work:hover .tw-actions { opacity:1; }
.tw-title { font-size:13px; color:#5a7a9a; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tw-actions { opacity:0; transition:opacity 0.15s ease; display:flex; gap:2px; }
.tw-actions button { background:none; border:none; cursor:pointer; padding:3px; border-radius:4px; color:#a0b8d0; display:flex; align-items:center; }
.tw-actions button:hover { color:#1e3a5f; background:#dbe8f4; }
.tw-actions button.del:hover { color:#c45c5c; background:#fce8e8; }

.tree-series { padding-left:24px; }
.series-block { margin-bottom:4px; }
.series-header { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-radius:6px; cursor:pointer; transition:background 0.15s ease; }
.series-header:hover { background:#eef4fa; }
.series-header:hover .se-actions { opacity:1; }
.series-left { display:flex; align-items:center; gap:6px; flex:1; }
.se-arrow { font-size:10px; color:#7a9ab8; transition:transform 0.2s ease; display:inline-block; width:12px; text-align:center; }
.se-arrow.open { transform:rotate(90deg); }
.se-name { font-size:13px; color:#4a6a8a; font-weight:500; }
.se-actions { opacity:0; transition:opacity 0.15s ease; display:flex; gap:2px; }
.se-actions button { background:none; border:none; cursor:pointer; padding:3px; border-radius:4px; color:#a0b8d0; display:flex; align-items:center; }
.se-actions button:hover { color:#1e3a5f; background:#dbe8f4; }
.se-actions button.del:hover { color:#c45c5c; background:#fce8e8; }
.tree-chapters { padding-left:24px; }

.page-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.page-header button {
  background:#fff; border:1px solid #d0e0f0; border-radius:8px; padding:6px 14px;
  font-size:14px; color:#4a6a8a; cursor:pointer; transition:all 0.15s ease; display:flex; align-items:center; gap:4px;
}
.page-header button:hover { background:#e8f1f8; border-color:#a0c0d8; }
.page-header h2 { font-size:18px; font-weight:500; color:#1e3a5f; }
.card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
.card {
  background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(30,58,95,0.06);
  cursor:pointer; position:relative; overflow:hidden; transition:transform 0.2s ease, box-shadow 0.2s ease;
  min-height:140px; display:flex; flex-direction:column; justify-content:center;
}
.card:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(30,58,95,0.12); }
.card-title { font-size:15px; font-weight:500; color:#1e3a5f; text-align:center; transition:opacity 0.25s ease; }
.card-summary {
  position:absolute; inset:0; padding:20px; font-size:13px; color:#4a6a8a; line-height:1.7;
  display:flex; align-items:center; justify-content:center; text-align:center;
  opacity:0; transition:opacity 0.25s ease; background:#fff; overflow:hidden;
}
.card:hover .card-title { opacity:0; }
.card:hover .card-summary { opacity:1; }
.card-actions {
  position:absolute; top:8px; right:8px; display:flex; gap:4px; opacity:0;
  transition:opacity 0.15s ease; z-index:2;
}
.card:hover .card-actions { opacity:1; }
.card-actions button { background:rgba(255,255,255,0.9); border:1px solid #e4edf5; border-radius:6px; cursor:pointer; padding:4px; color:#a0b8d0; display:flex; align-items:center; }
.card-actions button:hover { color:#1e3a5f; background:#eef4fa; }
.card-actions button.del:hover { color:#c45c5c; background:#fce8e8; }
.card-empty { background:#fff; border-radius:12px; padding:40px; text-align:center; color:#a0b8d0; font-size:14px; grid-column:1 / -1; }

.series-list { display:flex; flex-direction:column; gap:8px; }
.series-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(30,58,95,0.06); }
.series-card-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer; transition:background 0.15s ease; }
.series-card-header:hover { background:#f5f9fd; }
.series-card-header:hover .sc-actions { opacity:1; }
.sc-left { display:flex; align-items:center; gap:10px; flex:1; }
.sc-arrow { font-size:12px; color:#5a8ab8; transition:transform 0.2s ease; display:inline-block; }
.sc-arrow.open { transform:rotate(90deg); }
.sc-name { font-size:15px; font-weight:500; color:#1e3a5f; }
.sc-actions { opacity:0; transition:opacity 0.15s ease; display:flex; gap:4px; }
.sc-actions button { background:none; border:none; cursor:pointer; padding:4px; border-radius:6px; color:#a0b8d0; display:flex; align-items:center; }
.sc-actions button:hover { color:#1e3a5f; background:#e0ecf6; }
.sc-actions button.del:hover { color:#c45c5c; background:#fce8e8; }
.series-card-body { padding:0 18px 14px 44px; }
.series-chapter { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-radius:6px; cursor:pointer; transition:background 0.15s ease; }
.series-chapter:hover { background:#eef4fa; }
.series-chapter:hover .sch-actions { opacity:1; }
.sch-title { font-size:13px; color:#5a7a9a; flex:1; }
.sch-actions { opacity:0; transition:opacity 0.15s ease; display:flex; gap:2px; }
.sch-actions button { background:none; border:none; cursor:pointer; padding:3px; border-radius:4px; color:#a0b8d0; display:flex; align-items:center; }
.sch-actions button:hover { color:#1e3a5f; background:#dbe8f4; }
.sch-actions button.del:hover { color:#c45c5c; background:#fce8e8; }

.read-overlay {
  position:fixed; inset:0; background:rgba(30,58,95,0.35);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.read-overlay.active { display:flex; }
.read-panel {
  background:#fff; border-radius:14px; max-width:640px; width:100%; max-height:85vh;
  display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(30,58,95,0.15); overflow:hidden;
}
.read-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 22px; border-bottom:1px solid #e4edf5; flex-shrink:0;
}
.read-header-left { display:flex; align-items:center; gap:12px; }
.read-header-left span { font-size:16px; font-weight:500; color:#1e3a5f; }
.read-mode-toggle {
  font-size:12px; color:#5a9bd5; padding:4px 12px; border:1px solid #c8ddf0;
  border-radius:6px; background:#f5f9fd; cursor:pointer; transition:all 0.15s ease;
}
.read-mode-toggle:hover { background:#e0ecf6; }
.read-header button { background:none; border:none; cursor:pointer; padding:4px; border-radius:6px; color:#a0b8d0; }
.read-header button:hover { color:#1e3a5f; }
.read-body { padding:22px; overflow:auto; flex:1; }
.read-body pre {
  font-size:16px; color:#2a2a3a; line-height:1.9; white-space:pre-wrap;
  word-break:break-word; font-family: "SimSun", "Songti SC", "STSong", "AR PL New Sung", serif;
}
.read-body .empty { color:#a0b8d0; font-style:italic; }
.read-nav {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 22px; border-top:1px solid #e4edf5; flex-shrink:0;
}
.read-nav button {
  padding:6px 16px; border-radius:8px; font-size:13px; cursor:pointer;
  border:1px solid #d0e0f0; background:#f5f9fd; color:#4a6a8a;
  transition:all 0.15s ease;
}
.read-nav button:hover:not(:disabled) { background:#e0ecf6; border-color:#a0c0d8; }
.read-nav button:disabled { opacity:0.4; cursor:not-allowed; }
.read-nav-info { font-size:12px; color:#a0b8d0; }

.editor-overlay {
  position:fixed; inset:0; background:rgba(30,58,95,0.35);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.editor-overlay.active { display:flex; }
.editor-panel {
  background:#fff; border-radius:14px; max-width:520px; width:100%;
  box-shadow:0 12px 40px rgba(30,58,95,0.15); overflow:hidden;
}
.editor-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 22px; border-bottom:1px solid #e4edf5;
}
.editor-header span { font-size:16px; font-weight:500; color:#1e3a5f; }
.editor-header button { background:none; border:none; cursor:pointer; padding:4px; border-radius:6px; color:#a0b8d0; }
.editor-header button:hover { color:#1e3a5f; }
.editor-body { padding:18px 22px; }
.editor-body input, .editor-body textarea {
  width:100%; padding:10px 14px; margin-bottom:10px; border:1px solid #d0e0f0;
  border-radius:10px; font-size:14px; background:#fafcfe; color:#1a1a2e;
  outline:none; font-family:inherit; transition:border-color 0.15s ease;
}
.editor-body input:focus, .editor-body textarea:focus { border-color:#5a9bd5; }
.editor-body textarea { resize:vertical; min-height:80px; }
.editor-footer { display:flex; gap:10px; justify-content:flex-end; padding:0 22px 18px; }
.btn { padding:8px 18px; border-radius:8px; font-size:14px; cursor:pointer; border:none; transition:all 0.15s ease; }
.btn-secondary { background:#f0f6fb; color:#5a7a9a; border:1px solid #d0e0f0; }
.btn-secondary:hover { background:#e4edf5; }
.btn-primary { background:#1e3a5f; color:#fff; }
.btn-primary:hover { background:#2a4a75; }

footer {
  text-align:center; padding:32px 0 16px; margin-top:40px;
  color:#a0b8d0; font-size:12px; letter-spacing:0.5px;
}

.add-row {
  display:flex; align-items:center; gap:6px; padding:8px 10px;
  border-radius:6px; cursor:pointer; color:#5a9bd5; font-size:13px;
  transition:background 0.15s ease; margin-top:4px;
}
.add-row:hover { background:#eef4fa; }

/* 管理栏 */
.admin-bar {
  display:flex; justify-content:flex-end; gap:8px; margin-bottom:16px;
}
.admin-bar button {
  font-size:12px; color:#5a7a9a; padding:5px 12px; border:1px solid #d0e0f0;
  border-radius:6px; background:#fff; cursor:pointer; transition:all 0.15s ease;
}
.admin-bar button:hover { background:#e8f1f8; border-color:#a0c0d8; }

/* 密码弹窗 */
.pw-overlay {
  position:fixed; inset:0; background:rgba(30,58,95,0.4);
  display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.pw-overlay.active { display:flex; }
.pw-panel {
  background:#fff; border-radius:14px; max-width:360px; width:100%;
  box-shadow:0 12px 40px rgba(30,58,95,0.2); overflow:hidden; padding:28px;
  text-align:center;
}
.pw-panel h3 { font-size:18px; font-weight:500; color:#1e3a5f; margin-bottom:8px; }
.pw-panel p { font-size:13px; color:#7a9ab8; margin-bottom:16px; }
.pw-panel input {
  width:100%; padding:10px 14px; margin-bottom:12px; border:1px solid #d0e0f0;
  border-radius:10px; font-size:14px; background:#fafcfe; color:#1a1a2e;
  outline:none; text-align:center;
}
.pw-panel input:focus { border-color:#5a9bd5; }
.pw-panel .pw-error { color:#c45c5c; font-size:12px; margin-bottom:10px; display:none; }
.pw-panel .pw-btns { display:flex; gap:8px; justify-content:center; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>鱼的作品集归档</h1>
    <p>ArchiveOfYtta</p>
  </header>

  <div class="admin-bar" id="adminBar" style="display:none;">
    <button onclick="exportData()">导出备份</button>
    <button onclick="importData()">导入备份</button>
    <button onclick="logoutAdmin()">退出管理</button>
  </div>

  <div class="view active" id="treeView"></div>

  <div class="view" id="cardView">
    <div class="page-header">
      <button onclick="showTree()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回目录</button>
      <h2 id="cardTitle"></h2>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <div class="view" id="seriesView">
    <div class="page-header">
      <button onclick="showTree()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回目录</button>
      <h2 id="seriesTitle"></h2>
    </div>
    <div class="series-list" id="seriesList"></div>
  </div>

  <div class="view" id="chapterCardView">
    <div class="page-header">
      <button onclick="backToSeries()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回系列</button>
      <h2 id="chapterCardTitle"></h2>
    </div>
    <div class="card-grid" id="chapterCardGrid"></div>
  </div>

  <div class="read-overlay" id="readOverlay" onclick="if(event.target===this)closeRead()">
    <div class="read-panel">
      <div class="read-header">
        <div class="read-header-left">
          <span id="readTitle"></span>
          <button class="read-mode-toggle" id="readModeBtn" onclick="toggleReadMode()" style="display:none;">全文阅读</button>
        </div>
        <button onclick="closeRead()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="read-body"><pre id="readContent"></pre></div>
      <div class="read-nav" id="readNav"></div>
    </div>
  </div>

  <div class="editor-overlay" id="editorOverlay" onclick="if(event.target===this)closeEditor()">
    <div class="editor-panel">
      <div class="editor-header"><span id="editorTitle">添加</span><button onclick="closeEditor()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="editor-body" id="editorBody"></div>
      <div class="editor-footer"><button class="btn btn-secondary" onclick="closeEditor()">取消</button><button class="btn btn-primary" onclick="saveEditor()">保存</button></div>
    </div>
  </div>

  <div class="pw-overlay" id="pwOverlay">
    <div class="pw-panel">
      <h3>管理验证</h3>
      <p>请输入管理密码以启用编辑功能</p>
      <input type="password" id="pwInput" placeholder="密码" onkeydown="if(event.key==='Enter')checkPw()">
      <div class="pw-error" id="pwError">密码错误</div>
      <div class="pw-btns">
        <button class="btn btn-secondary" onclick="closePw()">取消</button>
        <button class="btn btn-primary" onclick="checkPw()">确认</button>
      </div>
    </div>
  </div>

  <footer>© 2026 YttaAnder. All rights reserved.</footer>
</div>

<script>
const DEFAULT_PW = "ytta2026";
const STORAGE_KEY = "ytta_portfolio_data";

let isAdmin = false;

const structure = [
  { name:'同人', open:true, children:[
    {name:'短篇同人', open:false, type:'short', works:[]},
    {name:'长篇同人', open:false, type:'long', series:[]}
  ]},
  { name:'原创', open:true, children:[
    {name:'短篇小说', open:false, type:'short', works:[]},
    {name:'长篇小说', open:false, type:'long', series:[]},
    {name:'诗歌', open:false, type:'short', works:[]},
    {name:'散文随笔', open:false, type:'short', works:[]}
  ]}
];

let appState = { view:'tree', ci:null, si:null, seriesIndex:null, chapterIndex:null, workIndex:null, readMode:'single' };
let editState = { mode:null, ci:null, si:null, seriesIndex:null, index:null };

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (saved && saved.length === 2) {
        structure[0].children = saved[0].children;
        structure[1].children = saved[1].children;
      }
    }
  } catch(e) { console.error('load failed', e); }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(structure));
  } catch(e) { console.error('save failed', e); }
}

function setView(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(name+'View').classList.add('active');
  appState.view = name;
}

function showTree() {
  setView('tree');
  renderTree();
}

function toggleAdmin() {
  if (isAdmin) { logoutAdmin(); return; }
  document.getElementById('pwOverlay').classList.add('active');
  setTimeout(()=>document.getElementById('pwInput').focus(),50);
}

function checkPw() {
  const val = document.getElementById('pwInput').value.trim();
  if (val === DEFAULT_PW) {
    isAdmin = true;
    document.getElementById('pwOverlay').classList.remove('active');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('adminBar').style.display = 'flex';
    renderTree();
    if (appState.view === 'card') renderCardGrid();
    if (appState.view === 'series') renderSeriesList();
    if (appState.view === 'chapterCard') renderChapterGrid();
  } else {
    document.getElementById('pwError').style.display = 'block';
  }
}

function closePw() {
  document.getElementById('pwOverlay').classList.remove('active');
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
}

function logoutAdmin() {
  isAdmin = false;
  document.getElementById('adminBar').style.display = 'none';
  renderTree();
  if (appState.view === 'card') renderCardGrid();
  if (appState.view === 'series') renderSeriesList();
  if (appState.view === 'chapterCard') renderChapterGrid();
}

function exportData() {
  const data = JSON.stringify(structure, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ytta_portfolio_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function() {
    const file = this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const saved = JSON.parse(e.target.result);
        if (saved && saved.length === 2) {
          structure[0].children = saved[0].children;
          structure[1].children = saved[1].children;
          saveData();
          renderTree();
          if (appState.view === 'card') renderCardGrid();
          if (appState.view === 'series') renderSeriesList();
          if (appState.view === 'chapterCard') renderChapterGrid();
          alert('备份导入成功');
        } else { alert('备份文件格式不正确'); }
      } catch(err) { alert('导入失败：' + err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function renderTree() {
  const el = document.getElementById('treeView');
  let h = '';
  structure.forEach((cat,ci)=>{

  document.getElementById('readModeBtn').style.display='inline-block';
  document.getElementById('readOverlay').classList.add('active');

function closeRead(){ document.getElementById('readOverlay').classList.remove('active'); }

function renderRead(){
  const sub=structure[appState.ci].children[appState.si];
  let title, content, prev, next, info;
  const nav=document.getElementById('readNav');

  if(sub.type==='short'){
    const works=sub.works;
    const idx=appState.workIndex;
    const w=works[idx];
    title=w.title;
    content=w.content||'暂无内容';
    prev=idx>0?()=>{appState.workIndex--;renderRead();}:null;
    next=idx<works.length-1?()=>{appState.workIndex++;renderRead();}:null;
    info=`${idx+1} / ${works.length}`;
  } else {
    const se=sub.series[appState.seriesIndex];
    const chs=se.chapters;
    if(appState.readMode==='single'){
      const idx=appState.chapterIndex;
      const ch=chs[idx];
      title=ch.title;
      content=ch.content||'暂无内容';
      prev=idx>0?()=>{appState.chapterIndex--;renderRead();}:null;
      next=idx<chs.length-1?()=>{appState.chapterIndex++;renderRead();}:null;
      info=`${idx+1} / ${chs.length}`;
      document.getElementById('readModeBtn').textContent='全文阅读';
    } else {
      title=se.name+'（全文）';
      content=chs.map((ch,i)=>`【${ch.title}】\n${ch.content||'暂无内容'}`).join('\n\n');
      prev=null; next=null; info=`共 ${chs.length} 章`;
      document.getElementById('readModeBtn').textContent='单章阅读';
    }
  }

  document.getElementById('readTitle').textContent=title;
  document.getElementById('readContent').textContent=content;

  let nh='';
  if(prev) nh+=`<button onclick="prev()">← 上一章</button>`;
  else nh+=`<button disabled>← 上一章</button>`;
  nh+=`<span class="read-nav-info">${info}</span>`;
  if(next) nh+=`<button onclick="next()">下一章 →</button>`;
  else nh+=`<button disabled>下一章 →</button>`;
  nav.innerHTML=nh;
}

function toggleReadMode(){
  appState.readMode = appState.readMode==='single'?'full':'single';
  renderRead();
}

function saveEditor(){
  const title=document.getElementById('edTitle').value.trim();
  if(!title){ alert('请输入标题'); return; }
  const summaryEl=document.getElementById('edSummary');
  const summary=summaryEl?summaryEl.value.trim():'';
  const contentEl=document.getElementById('edContent');
  const content=contentEl?contentEl.value.trim():'';

  if(editState.mode==='work'){
    const works=structure[editState.ci].children[editState.si].works;
    if(editState.index>=0){
      works[editState.index]={title,summary,content};
    } else {
      works.push({title,summary,content});
    }
    saveData();
    renderTree();
    if(appState.view==='card') renderCardGrid();
  } else if(editState.mode==='series'){
    const series=structure[editState.ci].children[editState.si].series;
    if(editState.index>=0){
      series[editState.index].name=title;
    } else {
      series.push({name:title,open:false,chapters:[]});
    }
    saveData();
    renderTree();
    if(appState.view==='series') renderSeriesList();
  } else if(editState.mode==='chapter'){
    const chs=structure[editState.ci].children[editState.si].series[editState.seriesIndex].chapters;
    if(editState.index>=0){
      chs[editState.index]={title,summary,content};
    } else {
      chs.push({title,summary,content});
    }
    saveData();
    renderTree();
    if(appState.view==='series') renderSeriesList();
    if(appState.view==='chapterCard') renderChapterGrid();
  }
  closeEditor();
}

function deleteWork(ci,si,wi){
  const title=structure[ci].children[si].works[wi].title;
  if(!confirm('确定删除「'+title+'」？')) return;
  structure[ci].children[si].works.splice(wi,1);
  saveData();
  renderTree();
  if(appState.view==='card') renderCardGrid();
}
function deleteSeries(ci,si,sei){
  const name=structure[ci].children[si].series[sei].name;
  if(!confirm('确定删除系列「'+name+'」及其所有章节？')) return;
  structure[ci].children[si].series.splice(sei,1);
  saveData();
  renderTree();
  if(appState.view==='series') renderSeriesList();
}
function deleteChapter(ci,si,sei,chi){
  const title=structure[ci].children[si].series[sei].chapters[chi].title;
  if(!confirm('确定删除章节「'+title+'」？')) return;
  structure[ci].children[si].series[sei].chapters.splice(chi,1);
  saveData();
  renderTree();
  if(appState.view==='series') renderSeriesList();
  if(appState.view==='chapterCard') renderChapterGrid();
}

function esc(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function escAttr(str){ return (str||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

loadData();
renderTree();
</script>
